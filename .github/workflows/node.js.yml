name: Github CI

# 监听 gh-pages 分支的改动
on:
  push:
    branches: 
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  Blog_CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2  #软件市场的名称
        with: # 参数
          submodules: false
      # 这里用的是 Node.js 13.x，14.x 生成 Hexo 静态页面会有问题
      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '16'

      # 配置Hexo环境 
      - name: Setup Hexo
        env:
          ACTION_DEPLOY_KEY: ${{ secrets.ACCESS_TOKEN }}
        run: |
          npm install hexo-cli -g
          npm install

      # 生成静态文件
      - name: Build
        run: |
          hexo clean 
          hexo g

      # 注入 translate.js 网页翻译（改 CI 产物，不动 Hexo 源码；忽略 pre/code 代码块）
      # 注意：不要用 client.edge 通道（其依赖的 edge.microsoft.com/translate/auth 已失效返回 404），默认通道即可
      # #translate 容器用 CSS 固定到右上角并加 🌐 提示，right:70px 避开 NexT 右上角搜索图标
      - name: Inject translate.js
        run: |
          grep -rl '</body>' public --include='*.html' | xargs sed -i 's@</body>@<style>#translate{position:fixed;top:12px;right:70px;z-index:9999;background:#fff;border:1px solid #ddd;border-radius:6px;padding:3px 8px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:13px;line-height:24px}#translate::before{content:"🌐 翻译/Translate:";margin-right:4px;color:#555}</style><script src="https://cdn.staticfile.net/translate.js/3.18.66/translate.js"></script><script>translate.language.setLocal("chinese_simplified");translate.ignore.tag.push("pre");translate.ignore.tag.push("code");translate.listener.start();translate.execute();</script></body>@'

      # 部署到 GitHub Pages
      - name: Upload GitHub Repository
        env: 
          # Github 仓库
          GITHUB_REPO: github.com/m4d3bug/m4d3bug.github.io
          TZ: 'Asia/Hong_Kong'
         # 将编译后的博客文件推送到指定仓库
        run: |
          cd ./public && git init && git add .
          git config user.name "m4d3bug"       #username改为你github的用户名
          git config user.email "m4d3bug@gmail.com"     #username改为你github的注册邮箱
          git add .
          git commit -m "GitHub Actions Auto Builder at $(date +'%Y-%m-%d %H:%M:%S')"
          git push --force --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@$GITHUB_REPO" master:master


